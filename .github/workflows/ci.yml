name: DINKLY CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 8.14.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run python scripts/validate_migrations.py
      - run: uv run python scripts/apply_migrations.py --dry-run
      - run: uv run ruff check app/backend scripts
      - run: uv run pytest app/backend/tests tests
      - run: pnpm --dir app/frontend lint
      - run: pnpm --dir app/frontend test
      - run: pnpm --dir app/frontend build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
